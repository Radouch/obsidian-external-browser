name: Build and test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Read version
        id: version
        shell: bash
        run: |
          echo "number=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: external-browser-${{ steps.version.outputs.number }}
          path: |
            main.js
            manifest.json
          if-no-files-found: error
